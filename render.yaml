services:
  - type: web
    name: stockwise-online
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: stockwise-db
          property: connectionString
databases:
  - name: stockwise-db
    plan: free
    region: frankfurt
    ipAllowList: []
